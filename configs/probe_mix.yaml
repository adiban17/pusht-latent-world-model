# Fair image judge probe_mix (Phase 5b; pre-registered judge decision in PROGRESS.md).
# State probe (§7 targets) trained on real + rendered frames and on the frozen models' outputs.
seed: 0
model:
  latent_dim: 256
  pool: flatten            # §7 encoder; the coord_gap fallback is below
types: [real, wm_recon, wm1step_recon, pixel_1step]   # equal share of every batch
shift_px: 4                # ±4 px random shift, position labels shifted to match
val_seeds: [190, 199]      # real val episodes (excluded from training; reported)
train:
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  steps: 20000
  grad_clip: 1.0
  amp: true
  val_every: 1000          # keep-best on the rendered-val loss (mean over the 4 types)
  ckpt_every: 5000
  log_every: 100
val:
  seeds: [190, 199]
  windows: 1024            # rendered-val samples per frame type
  seed: 0
fallback:                  # trained only if the flatten judge's real-frame test angle > trigger
  pool: coord_gap
  trigger_real_angle_deg: 30.0
accept:                    # pre-registered acceptance on test frames
  real_angle_deg: 15.0
  real_block_px: 13.4      # 1.25 x the v1 probe's 10.7 px
  derived_ratio: 1.5       # block and pusher px of each derived type <= 1.5 x real's
grid:
  step_deg: 5.0
  positions: [[192, 192], [320, 192], [192, 320], [320, 320]]
smoke:
  local:
    batch_size: 16
    steps: 50
    warmup_steps: 5
    val_every: 25
    ckpt_every: 25
    log_every: 10
    val_windows: 16
  remote:
    batch_size: 256
    steps: 300
    warmup_steps: 30
    val_every: 100
    ckpt_every: 150
    log_every: 25
    val_windows: 1024
