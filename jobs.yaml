# Job registry (CLAUDE.md §10). run.py reads this file.
#   phase:  the build phase that implements the job
#   module: python module with `run(ctx, report)`
#   config: YAML config file (null = none); hashed together with this entry -> config_hash
#   needs:  store artifacts the job reads
#   makes:  store artifacts the job writes (used for skip/resume)
jobs:
  env_check:
    phase: 1
    module: wm.jobs.env_check
    config: null
    needs: []
    makes: [env-check]
  collect_data:
    phase: 2
    module: wm.jobs.collect_data
    config: configs/data.yaml
    needs: []
    makes: [pusht-data]
  train_wm:
    phase: 3
    module: wm.jobs.train_wm
    config: configs/wm.yaml
    needs: [pusht-data]
    makes: [ckpt-wm]
  diagnose_wm:          # eval only: train-vs-val loss terms, reconstruction, ridge probe on z
    phase: 3
    module: wm.jobs.diagnose_wm
    config: null
    needs: [pusht-data, ckpt-wm]
    makes: []           # writes outputs only, so it reruns every time
  wm_ablate:            # Phase 3b: short runs of the world-model fixes (fg_weight, proprio, keep_best)
    phase: 3
    module: wm.jobs.wm_ablate
    config: configs/wm_ablate.yaml
    needs: [pusht-data]
    makes: [results-wm-ablate]
  train_wm_1step:
    phase: 4
    module: wm.jobs.train_wm_1step
    config: configs/wm_1step.yaml
    needs: [pusht-data]
    makes: [ckpt-wm-1step]
  train_pixel:
    phase: 4
    module: wm.jobs.train_pixel
    config: configs/pixel.yaml
    needs: [pusht-data]
    makes: [ckpt-pixel]
  train_bc:
    phase: 4
    module: wm.jobs.train_bc
    config: configs/bc.yaml
    needs: [pusht-data]
    makes: [ckpt-bc]
  train_probe:
    phase: 4
    module: wm.jobs.train_probe
    config: configs/probe.yaml
    needs: [pusht-data]
    makes: [ckpt-probe]
  eval_rollouts:
    phase: 5
    module: wm.jobs.eval_rollouts
    config: null
    needs: [pusht-data, ckpt-wm, ckpt-wm-1step, ckpt-pixel, ckpt-probe]
    makes: [results-rollouts]
  plan_val:
    phase: 6
    module: wm.jobs.plan_val
    config: configs/plan.yaml
    needs: [pusht-data, ckpt-wm, ckpt-wm-1step, ckpt-bc]
    makes: [results-plan-val]
  plan_sweep:
    phase: 6
    module: wm.jobs.plan_sweep
    config: configs/plan.yaml
    needs: [pusht-data, ckpt-wm, ckpt-wm-1step, ckpt-bc]
    makes: [results-plan-sweep]
  final_eval:
    phase: 7
    module: wm.jobs.final_eval
    config: configs/plan.yaml
    needs: [pusht-data, ckpt-wm, ckpt-wm-1step, ckpt-pixel, ckpt-bc, ckpt-probe]
    makes: [results-final, results-bundle]
  make_report:
    phase: 8
    module: wm.jobs.make_report
    config: null
    needs: []
    makes: []

# A group runs its jobs in order and stops at the first failure; each job is skipped if
# already complete (diagnose_wm makes nothing, so it always reruns; it only evaluates).
groups:
  train_baselines:
    phase: 4
    jobs: [train_wm_1step, train_pixel, train_bc, train_probe]
  overnight:            # one long Kaggle session: the world model, its diagnosis, then the baselines
    phase: 4            # (a member that is a group is expanded in place)
    jobs: [train_wm, diagnose_wm, train_baselines]
